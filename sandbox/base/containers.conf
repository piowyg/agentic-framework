# rootless Podman inside a session container (`sandbox.containers`): no cgroups, no namespaces it can't create
# without SYS_ADMIN, the container's /proc instead of a fresh mount, user-mode networking (pasta)
[containers]
volumes = ["/proc:/proc"]
default_sysctls = []
netns = "pasta"
utsns = "host"
ipcns = "host"
cgroupns = "host"
cgroups = "disabled"
log_driver = "k8s-file"

[network]
default_rootless_network_cmd = "pasta"
# a compose project's own network: nftables rules for it fail under Docker Desktop's kernel; the session network is
# internal anyway, and published ports go through rootlessport, not nft
firewall_driver = "none"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
